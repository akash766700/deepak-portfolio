<?xml version="1.0" encoding="UTF-8"?>
<svg width="560" height="350" viewBox="0 0 560 350" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Card Surface Gradient -->
    <linearGradient id="cardBg" x1="0" y1="0" x2="560" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FBFBFC" />
      <stop offset="100%" stop-color="#F4F5F7" />
    </linearGradient>

    <!-- Ambient Brand Glow in Corner -->
    <radialGradient id="brandGlow" cx="500" cy="50" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.14" />
      <stop offset="50%" stop-color="#1E3A8A" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Tag Background Pill -->
    <linearGradient id="tagBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#F97316" stop-opacity="0.12" />
    </linearGradient>

    <!-- Card Soft Inner Stroke -->
    <linearGradient id="cardBorder" x1="0" y1="0" x2="560" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.9)" />
      <stop offset="50%" stop-color="rgba(0, 0, 0, 0.06)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0.09)" />
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="556" height="346" rx="26" fill="url(#cardBg)" />
  <rect x="2" y="2" width="556" height="346" rx="26" fill="url(#brandGlow)" />
  <rect x="2" y="2" width="556" height="346" rx="26" stroke="url(#cardBorder)" stroke-width="2" />

  <!-- Top Decorative Top Light Bar -->
  <path d="M 28 4 L 532 4" stroke="rgba(255, 255, 255, 0.8)" stroke-width="2" stroke-linecap="round" />

  <!-- TOP HEADER -->
  <g transform="translate(36, 34)">
    <!-- Icon Container -->
    <g>
      
      <rect width="52" height="52" rx="14" fill="#1E3A8A"/>
      <path d="M14 18h24v4H14z" fill="#FF9933"/>
      <path d="M14 24h24v4H14z" fill="#FFFFFF"/>
      <path d="M14 30h24v4H14z" fill="#138808"/>
      <circle cx="26" cy="26" r="2.8" fill="#000080"/>
    
    </g>

    <!-- Category Tag Pill (Top Right) -->
    <g transform="translate(488, 10)">
      <!-- Right aligned: transform anchor -->
      <rect x="-170" y="0" width="170" height="30" rx="15" fill="url(#tagBg)" stroke="#1E3A8A" stroke-opacity="0.18" stroke-width="1"/>
      <circle cx="-154" cy="15" r="3.5" fill="#F97316"/>
      <text x="-142" y="19.5" font-family="'Outfit', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1E3A8A" letter-spacing="0.8">TAX GOVERNANCE</text>
    </g>
  </g>

  <!-- TITLE & SUBTITLE -->
  <g transform="translate(36, 126)">
    <!-- Software Title -->
    <text x="0" y="22" font-family="'Outfit', -apple-system, sans-serif" font-size="25" font-weight="700" fill="#0F172A" letter-spacing="-0.5">Indian GST Portal</text>
    
    <!-- Subtitle / Capability -->
    <text x="0" y="52" font-family="'Outfit', -apple-system, sans-serif" font-size="14.5" font-weight="500" fill="#64748B" letter-spacing="-0.1">
      Monthly GSTR-1 & 3B Filing, 2B vs Purchase Auto-Reconciliation
    </text>
  </g>

  <!-- DIVIDER LINE -->
  <line x1="36" y1="210" x2="524" y2="210" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="2 3" />

  <!-- CHIP PILLS (Capabilities) -->
  <g transform="translate(36, 230)">
    <!-- Chip 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="118.19999999999999" height="32" rx="16" fill="#F1F5F9" stroke="rgba(0,0,0,0.06)" stroke-width="1"/>
      <text x="59.099999999999994" y="20.5" font-family="'Outfit', -apple-system, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">GSTR-1 & 3B</text>
    </g>

    <!-- Chip 2 -->
    <g transform="translate(128.2, 0)">
      <rect x="0" y="0" width="159.2" height="32" rx="16" fill="#F1F5F9" stroke="rgba(0,0,0,0.06)" stroke-width="1"/>
      <text x="79.6" y="20.5" font-family="'Outfit', -apple-system, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">GSTR-2B Matching</text>
    </g>

    <!-- Chip 3 -->
    <g transform="translate(297.4, 0)">
      <rect x="0" y="0" width="159.2" height="32" rx="16" fill="#F1F5F9" stroke="rgba(0,0,0,0.06)" stroke-width="1"/>
      <text x="79.6" y="20.5" font-family="'Outfit', -apple-system, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">ITC Maximization</text>
    </g>
  </g>

  <!-- FOOTER STATUS -->
  <g transform="translate(36, 298)">
    <!-- Active Green Status Dot -->
    <circle cx="5" cy="5" r="4.5" fill="#10B981" />
    <circle cx="5" cy="5" r="7.5" fill="#10B981" fill-opacity="0.25" />
    <text x="22" y="9" font-family="'Outfit', -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#64748B">Statutory Portal • Zero-Default Track</text>

    <!-- Right DG Monogram Badge -->
    <g transform="translate(488, 2)">
      <text x="0" y="8" font-family="'Outfit', -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#94A3B8" letter-spacing="1.2" text-anchor="end">DG STACK</text>
    </g>
  </g>
</svg>
